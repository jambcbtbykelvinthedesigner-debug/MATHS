<!DOCTYPE html>
<html>
<head>

    <title>JAMB MATH 40 | KELVIN THE DESIGNER</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { --dev-blue: #00d4ff; --bg: #030508; --card: rgba(255, 255, 255, 0.07); --accent: #ff007a; --success: #00ff88; --wa-green: #25d366; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        #app-wrapper { width: 92%; max-width: 800px; margin: auto; padding: 20px 0; }
        .dev-header { text-align: center; padding: 20px; border-bottom: 2px solid var(--dev-blue); margin-bottom: 25px; background: rgba(0,212,255,0.05); border-radius: 0 0 20px 20px; }
        .dev-header h1 { margin: 0; color: var(--dev-blue); font-size: 1.6em; text-transform: uppercase; letter-spacing: 2px; }
        .glass { background: var(--card); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); border-radius: 18px; padding: 25px; margin-bottom: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        .name-input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 8px; border: 1px solid var(--dev-blue); background: rgba(0,0,0,0.5); color: #fff; box-sizing: border-box; outline: none; }
        #nav-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; margin-bottom: 20px; max-height: 160px; overflow-y: auto; padding: 10px; background: rgba(0,0,0,0.5); border-radius: 12px; }
        .nav-dot { height: 32px; background: #1a1a1a; border: 1px solid #333; display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer; font-size: 0.75em; }
        .nav-dot.active { border-color: var(--dev-blue); background: rgba(0,212,255,0.2); box-shadow: 0 0 8px var(--dev-blue); }
        .nav-dot.answered { background: var(--dev-blue); color: #000; font-weight: bold; }
        .opt-label { display: flex; align-items: center; background: rgba(255,255,255,0.04); padding: 15px; margin: 10px 0; border-radius: 10px; cursor: pointer; border: 1px solid transparent; }
        .opt-label.selected { border-color: var(--dev-blue); background: rgba(0,212,255,0.1); }
        input[type="radio"] { display: none; }
        .btn { padding: 14px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; }
        .btn-main { background: var(--dev-blue); color: #000; }
        .wa-btn { position: fixed; bottom: 20px; right: 20px; background: var(--wa-green); color: white; padding: 12px 20px; border-radius: 30px; text-decoration: none; font-weight: bold; z-index: 1000; }
        .hidden { display: none; }
        footer { text-align: center; color: #555; font-size: 0.75em; padding: 20px; }
    </style>
</head>
<body onload="loadBest()">

<a href="https://wa.me/2349032320783" class="wa-btn" target="_blank">MESSAGE THE DESIGNER</a>

<div id="app-wrapper">
    <div class="dev-header">
        <h1>KELVIN THE DESIGNER</h1>
        <p>Mathematics Mastery • 40 Core Questions</p>
    </div>

    <div id="start-page" class="glass" style="text-align: center;">
        <h2 style="color:var(--dev-blue)">MATH CBT PRACTICE</h2>
        <input type="text" id="user-name" class="name-input" placeholder="Enter Full Name...">
        <div id="best-score" style="margin: 10px 0; font-weight: bold; color: var(--success);"></div>
        <button class="btn btn-main" onclick="initExam()">START 40-QUESTION EXAM</button>
    </div>

    <div id="exam-page" class="hidden">
        <div id="timer" style="text-align:center; font-size: 1.8em; color: var(--accent); font-weight: 800; margin-bottom: 10px;">30:00</div>
        <div id="nav-grid"></div>
        <div class="glass">
            <div id="q-text" style="font-size: 1.1em; line-height: 1.5; margin-bottom: 15px;"></div>
            <div id="options-area"></div>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button class="btn" style="background:#222; color:#fff;" onclick="nav(-1)">PREV</button>
                <button class="btn btn-main" onclick="nav(1)">NEXT</button>
            </div>
        </div>
        <button class="btn" style="background:var(--success); color:#000; margin-top:10px;" onclick="finalize()">SUBMIT EXAM</button>
    </div>

    <div id="result-page" class="hidden">
        <div class="glass" style="text-align:center;">
            <h1 id="final-score" style="font-size:4em; margin:10px 0;">0 / 40</h1>
            <p id="sync-status" style="font-size: 0.8em; color: #888;">Syncing to Lagos Database...</p>
            <button class="btn btn-main" onclick="location.reload()">RESTART</button>
        </div>
        <h3 style="text-align:center; color:var(--dev-blue);">CORRECTION LIST</h3>
        <div id="review-list"></div>
    </div>

    <footer>&copy; 2026 Kelvin the Designer. Lagos, Nigeria.</footer>
</div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbypAjBMxjI7fOJshx64Qq0_r2XYPxYgatKbgPd-IGTQugF5iKdVfFd2vlC26QIurakNag/exec";

// YOUR SPECIFIC 40 QUESTIONS & MAPPED ANSWERS
const masterDB = [
    {q:"If 3^{x+1} = 81, find x.", a:"3", ops:["2","3","4","5"]},
    {q:"A price increases by 20% then decreases by 30%. The net change is:", a:"16% decrease", ops:["4% increase","16% decrease","10% decrease","10% increase"]},
    {q:"Solve: 2^{2x} * 4^{1-x} = 8", a:"1", ops:["-1","0","1","2"]},
    {q:"A sum of money doubles in 5 years at simple interest. The rate per annum is:", a:"20%", ops:["20%","10%","25%","15%"]},
    {q:"Round 0.007845 to 3 significant figures.", a:"0.00785", ops:["0.00784","0.00785","0.0078","0.0079"]},
    {q:"Simplify: (√50 + √18)/√2", a:"9", ops:["7","8","9","10"]},
    {q:"Solve for x: log_2 (x-1) + log_2 (x+1) = 3", a:"3", ops:["3","2","1","4"]},
    {q:"If 3/4 of a number is 15, find 150% of the number.", a:"30", ops:["18.75","20","30","25"]},
    {q:"Solve: (3x-2)/4 > 5", a:"x>7.33", ops:["x>7.33","x>5","x>7","x>8"]},
    {q:"In a class of 50, 30 offer Maths, 25 offer English, 10 offer both. How many offer neither?", a:"5", ops:["5","10","15","20"]},
    {q:"Solve: 5 - 2x ≤ 3x + 10", a:"x ≥ -1", ops:["x ≥ -1","x ≤ 1","x ≥ -3","x ≤ 3"]},
    {q:"Factorize: x^2 + 5x + 6", a:"(x+2)(x+3)", ops:["(x+2)(x+3)","(x-2)(x+3)","(x+1)(x+6)","(x+2)(x+4)"]},
    {q:"The 5th term of an AP is 20, the 8th term is 32. Find the sum of first 10 terms.", a:"210", ops:["220","210","200","230"]},
    {q:"Solve: {x + y = 7, 2x - y = 4}", a:"x=3.66, y=3.33", ops:["x=3.66, y=3.33","x=4, y=3","x=2, y=5","x=5, y=2"]},
    {q:"Rationalize: 3/(2+√3)", a:"6 - 3√3", ops:["6 - 3√3","2+√3","2√3-3","2√3+3"]},
    {q:"If y varies directly as x^2 and inversely as z, y=18 when x=3, z=2. Find y when x=6, z=3.", a:"48", ops:["24","48","54","72"]},
    {q:"Solve: x^2 - 5x + 6 = 0", a:"2,3", ops:["2,3","-2,-3","1,6","-1,-6"]},
    {q:"Simplify: (2x + 3)(x - 5) + 10", a:"2x^2 - 7x - 5", ops:["2x^2 - 7x - 5","2x^2 - 7x + 5","2x^2 + 7x - 5","None"]},
    {q:"Solve: 2^{x+1} = 16", a:"4", ops:["3","4","2","5"]},
    {q:"Express 0.0003456 in standard form to 2 significant figures.", a:"3.5 × 10^{-4}", ops:["3.46 × 10^{-4}","3.45 × 10^{-4}","3.5 × 10^{-4}","3.4 × 10^{-4}"]},
    {q:"Length measured as 12.34 cm. Actual length = 12.36 cm. % Error?", a:"0.16%", ops:["0.16%","0.18%","0.20%","0.25%"]},
    {q:"The sum of first 5 terms of a GP is 121, first term 3. Find the common ratio.", a:"3", ops:["2","3","4","5"]},
    {q:"If y varies inversely as x, y=6 when x=4. Find y when x=12.", a:"2", ops:["2","3","4","6"]},
    {q:"Solve: {3x + 2y = 7, 4x^2 - y = 5}", a:"x=1, y=4", ops:["x=1, y=4","x=2, y=1","x=-1, y=1","x=1, y=-1"]},
    {q:"If x^2 + kx + 16 = 0 has equal roots, find k.", a:"-8", ops:["8","-8","4","-4"]},
    {q:"Solve: 3^{2x} = 81", a:"3", ops:["2","1","3","4"]},
    {q:"Solve: 5^{x-1} = 25", a:"2", ops:["1","2","3","4"]},
    {q:"Simplify: (√32 - √8)/√2", a:"6", ops:["4","6","8","10"]},
    {q:"Solve: log_3 (x+2) - log_3 (x-1) = 2", a:"8", ops:["6","7","8","9"]},
    {q:"Factorize: x^2 - 7x + 12", a:"(x-3)(x-4)", ops:["(x-3)(x-4)","(x+3)(x-4)","(x-3)(x+4)","(x+3)(x+4)"]},
    {q:"Solve: 7x - 5 = 3x + 11", a:"5", ops:["3","4","5","6"]},
    {q:"Solve: 4x^2 - 12x + 9 = 0", a:"1.5", ops:["1.5","2","3","2.5"]},
    {q:"Solve inequality: 2x + 5 ≥ 11", a:"x ≥ 3", ops:["x ≥ 2","x ≥ 3","x ≥ 4","x ≥ 5"]},
    {q:"First term of AP = 5, common difference = 3. Find 10th term.", a:"35", ops:["32","35","29","30"]},
    {q:"Sum of first n natural numbers = 210. Find n.", a:"21", ops:["20","21","14","15"]},
    {q:"Solve for x: (2x+3)/5 = 7", a:"16", ops:["14","16","17.5","18"]},
    {q:"A number decreased by 25% then increased by 40%. Net change?", a:"5% increase", ops:["5% increase","5% decrease","10% increase","10% decrease"]},
    {q:"If x^2 - 9x + 20 = 0, find the roots.", a:"4,5", ops:["4,5","5,6","3,6","2,5"]},
    {q:"The 3rd term of an AP = 7, 6th term = 16. Find the 10th term.", a:"30", ops:["28","30","31","32"]},
    {q:"Simplify: (2√3 + √12)/√3", a:"6", ops:["4","5","6","7"]}
];

let quiz = []; let idx = 0; let stored = {}; let time = 1800; let ticker; let studentName = "";

function loadBest() {
    let b = localStorage.getItem('k_math_40_best') || 0;
    document.getElementById('best-score').innerText = `Best: ${b}/40`;
}

function initExam() {
    studentName = document.getElementById('user-name').value;
    if(!studentName) { alert("Enter Name first!"); return; }
    document.getElementById('start-page').classList.add('hidden');
    document.getElementById('exam-page').classList.remove('hidden');
    quiz = masterDB; 
    drawNav(); render();
    ticker = setInterval(() => {
        time--; let m = Math.floor(time/60); let s = time%60;
        document.getElementById('timer').innerText = `${m}:${s<10?'0':''}${s}`;
        if(time <= 0) finalize();
    }, 1000);
}

function render() {
    let item = quiz[idx];
    document.getElementById('q-text').innerHTML = `<b>QUESTION ${idx+1}:</b><br>${item.q}`;
    let oh = '';
    item.ops.forEach(o => {
        oh += `<label class="opt-label ${stored[idx]===o?'selected':''}">
            <input type="radio" name="math" value="${o}" onchange="pick('${o}')" ${stored[idx]===o?'checked':''}> ${o}
        </label>`;
    });
    document.getElementById('options-area').innerHTML = oh;
    drawNav();
}

function pick(v) { stored[idx] = v; render(); }
function goTo(i) { idx = i; render(); }
function nav(d) { idx += d; if(idx < 0) idx = 0; if(idx > 39) idx = 39; render(); }
function drawNav() {
    let h = ''; quiz.forEach((_, i) => {
        h += `<div class="nav-dot ${i===idx?'active':''} ${stored[i]?'answered':''}" onclick="goTo(${i})">${i+1}</div>`;
    });
    document.getElementById('nav-grid').innerHTML = h;
}

function finalize() {
    clearInterval(ticker);
    let score = 0; let rev = "";
    quiz.forEach((itm, i) => {
        let u = stored[i] || "Skipped";
        let isCorrect = u === itm.a;
        if(isCorrect) score++;
        rev += `<div class="glass" style="border-left:5px solid ${isCorrect?'var(--success)':'var(--accent)'}">
            <p><b>Q${i+1}:</b> ${itm.q}</p>
            <p>Your Answer: <span style="color:${isCorrect?'var(--success)':'var(--accent)'}">${u}</span></p>
            ${!isCorrect ? `<p>Correct Answer: <b style="color:var(--success)">${itm.a}</b></p>` : ""}
        </div>`;
    });
    
    document.getElementById('exam-page').classList.add('hidden');
    document.getElementById('result-page').classList.remove('hidden');
    document.getElementById('final-score').innerText = `${score} / 40`;
    document.getElementById('review-list').innerHTML = rev;
    localStorage.setItem('k_math_40_best', score);

    // Sync to your specific Apps Script URL
    fetch(WEB_APP_URL, {
        method: "POST",
        mode: "no-cors",
        body: JSON.stringify({ name: studentName, score: score + "/40", subject: "Math40", date: new Date().toLocaleString() })
    }).then(() => {
        document.getElementById('sync-status').innerText = "Data saved to Lagos Sheet.";
    });
}
</script>
</body>
</html>
