<!DOCTYPE html>
<html>
<head>

    <title>JAMB MATH 60 | KELVIN THE DESIGNER</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { --dev-blue: #00d4ff; --bg: #030508; --card: rgba(255, 255, 255, 0.07); --accent: #ff007a; --success: #00ff88; --wa-green: #25d366; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        #app-wrapper { width: 92%; max-width: 800px; margin: auto; padding: 20px 0; }
        .dev-header { text-align: center; padding: 20px; border-bottom: 2px solid var(--dev-blue); margin-bottom: 25px; background: rgba(0,212,255,0.05); border-radius: 0 0 20px 20px; }
        .dev-header h1 { margin: 0; color: var(--dev-blue); font-size: 1.6em; text-transform: uppercase; letter-spacing: 2px; }
        .glass { background: var(--card); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); border-radius: 18px; padding: 25px; margin-bottom: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        .name-input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 8px; border: 1px solid var(--dev-blue); background: rgba(0,0,0,0.5); color: #fff; box-sizing: border-box; outline: none; }
        #nav-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; margin-bottom: 20px; max-height: 160px; overflow-y: auto; padding: 10px; background: rgba(0,0,0,0.5); border-radius: 12px; }
        .nav-dot { height: 32px; background: #1a1a1a; border: 1px solid #333; display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer; font-size: 0.7em; }
        .nav-dot.active { border-color: var(--dev-blue); background: rgba(0,212,255,0.2); }
        .nav-dot.answered { background: var(--dev-blue); color: #000; font-weight: bold; }
        .opt-label { display: flex; align-items: center; background: rgba(255,255,255,0.04); padding: 15px; margin: 10px 0; border-radius: 10px; cursor: pointer; border: 1px solid transparent; }
        .opt-label.selected { border-color: var(--dev-blue); background: rgba(0,212,255,0.1); }
        input[type="radio"] { display: none; }
        .btn { padding: 14px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; }
        .btn-main { background: var(--dev-blue); color: #000; }
        .explanation-card { margin-top: 15px; padding: 15px; border-radius: 10px; background: #000; border: 1px dashed var(--dev-blue); font-size: 0.9em; line-height: 1.4; }
        .wa-btn { position: fixed; bottom: 20px; right: 20px; background: var(--wa-green); color: white; padding: 12px 20px; border-radius: 30px; text-decoration: none; font-weight: bold; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .hidden { display: none; }
        footer { text-align: center; color: #555; font-size: 0.75em; padding: 20px; }
    </style>
</head>
<body onload="loadBest()">

<a href="https://wa.me/2349032320783" class="wa-btn" target="_blank">MESSAGE the DESIGNER</a>

<div id="app-wrapper">
    <div class="dev-header">
        <img src="logo.png" alt="Kelvin Logo" style="height: 60px; margin-bottom: 10px;">
        <h1>KELVIN THE DESIGNER</h1>
        <p>Mathematics Engine • 30 Min Challenge • v10.0</p>
    </div>

    <div id="start-page" class="glass" style="text-align: center;">
        <h2 style="color:var(--dev-blue)">MATHEMATICS CBT 2026</h2>
        <input type="text" id="user-name" class="name-input" placeholder="Enter Full Name...">
        <div id="best-score" style="margin: 10px 0; font-weight: bold; color: var(--success);"></div>
        <button class="btn btn-main" onclick="initExam()">START 30-MINUTE EXAM</button>
    </div>

    <div id="exam-page" class="hidden">
        <div id="timer" style="text-align:center; font-size: 1.8em; color: var(--accent); font-weight: 800; margin-bottom: 10px;">30:00</div>
        <div id="nav-grid"></div>
        <div class="glass">
            <div id="q-text" style="font-size: 1.1em; line-height: 1.5; margin-bottom: 15px;"></div>
            <div id="options-area"></div>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button class="btn" style="background:#222; color:#fff;" onclick="nav(-1)">PREV</button>
                <button class="btn btn-main" onclick="nav(1)">NEXT</button>
            </div>
        </div>
        <button class="btn" style="background:var(--success); color:#000; margin-top:10px;" onclick="finalize()">SUBMIT TO DESIGNER</button>
    </div>

    <div id="result-page" class="hidden">
        <div class="glass" style="text-align:center;">
            <h2 id="congrats-text" style="color:var(--dev-blue)">RESULTS</h2>
            <h1 id="final-score" style="font-size:4em; margin:10px 0;">0 / 60</h1>
            <p id="sync-status" style="font-size: 0.8em; color: #888;">Syncing records...</p>
            <button class="btn btn-main" onclick="location.reload()">TRY NEW SET</button>
        </div>
        <div id="review-list"></div>
    </div>

    <footer>&copy; 2026 Kelvin the Designer. Lagos, Nigeria.</footer>
</div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxXWvYHKm7A3mt32RlZa-eFwp1BZCOELoqoNOUYoKClKeYml9D9_ClpU5frqMMK5W-t/exec";

// 60 COMPLETELY UNIQUE QUESTIONS - NO LOOPS
const masterDB = [
    {q:"Solve for x: $3x - 7 = 14$", a:"7", ops:["5","7","9","21"], ex:"$3x = 21 \rightarrow x = 7$"},
    {q:"Find the value of $log_{10} 1000$.", a:"3", ops:["2","3","4","10"], ex:"$10^3 = 1000$"},
    {q:"Differentiate $y = 4x^3$ with respect to x.", a:"12x^2", ops:["12x^2","4x^2","12x","7x^2"], ex:"Apply power rule: $3 \times 4x^{(3-1)}$"},
    {q:"What is the sum of interior angles of a hexagon?", a:"720°", ops:["360°","540°","720°","900°"], ex:"Formula: $(n-2) \times 180 \rightarrow 4 \times 180 = 720$"},
    {q:"Find the gradient of the line $2y = 6x + 4$.", a:"3", ops:["2","3","6","4"], ex:"$y = 3x + 2$. Gradient (m) is 3."},
    {q:"Solve the quadratic equation: $x^2 - 5x + 6 = 0$.", a:"x=2, 3", ops:["x=1, 6","x=2, 3","x=-2, -3","x=0, 5"], ex:"Factors are $(x-2)(x-3)$"},
    {q:"Evaluate $∫ 2x dx$.", a:"x^2 + C", ops:["x^2 + C","2x^2 + C","x + C","x^2"], ex:"Integration rule: $x^{n+1}/(n+1)$"},
    {q:"What is the value of $sin 30°$?", a:"0.5", ops:["0.5","0.866","1","0"], ex:"Standard trigonometric ratio."},
    {q:"Find the median of: 3, 7, 9, 4, 12, 5, 10.", a:"7", ops:["5","7","9","4"], ex:"Ordered: 3, 4, 5, 7, 9, 10, 12. Middle is 7."},
    {q:"If a set A = {1, 2, 3} and B = {3, 4, 5}, find A ∩ B.", a:"{3}", ops:["{1,2,3,4,5}","{3}","{1,2}","∅"], ex:"Intersection is the common element."},
    {q:"Calculate the area of a circle with radius 7cm (Take π=22/7).", a:"154cm²", ops:["44cm²","154cm²","196cm²","49cm²"], ex:"$A = πr^2 \rightarrow (22/7) \times 49 = 154$"},
    {q:"Find the simple interest on #5000 for 2 years at 5% per annum.", a:"#500", ops:["#250","#500","#1000","#50"], ex:"$I = (P \times R \times T)/100$"},
    {q:"The third term of a GP is 18 and the fourth term is 54. Find the common ratio.", a:"3", ops:["2","3","6","9"], ex:"$r = T4/T3 = 54/18 = 3$"},
    {q:"Convert 25 to binary (base 2).", a:"11001", ops:["11001","10101","11100","10011"], ex:"Repeated division by 2."},
    {q:"Find the value of x if $2^{x+1} = 32$.", a:"4", ops:["3","4","5","6"], ex:"$2^5 = 32 \rightarrow x+1 = 5 \rightarrow x = 4$"},
    {q:"What is the probability of picking a queen from a standard deck of 52 cards?", a:"1/13", ops:["1/4","1/52","1/13","4/13"], ex:"4 Queens in 52 cards: $4/52 = 1/13$"},
    {q:"Simplify: $\sqrt{72} + \sqrt{50}$.", a:"11\sqrt{2}", ops:["11\sqrt{2}","6\sqrt{2}","5\sqrt{2}","122"], ex:"$6\sqrt{2} + 5\sqrt{2} = 11\sqrt{2}$"},
    {q:"Find the mode of the data: 2, 3, 3, 4, 5, 5, 5, 6.", a:"5", ops:["3","5","6","2"], ex:"5 occurs most frequently."},
    {q:"Calculate the volume of a cylinder with r=3cm and h=7cm (π=22/7).", a:"198cm³", ops:["66cm³","132cm³","198cm³","250cm³"], ex:"$V = πr^2h \rightarrow (22/7) \times 9 \times 7 = 198$"},
    {q:"Differentiate $cos x$.", a:"-sin x", ops:["sin x","-sin x","tan x","-cos x"], ex:"Standard derivative."},
    {q:"Solve: $x/3 + 4 = 10$.", a:"18", ops:["6","18","12","2"], ex:"$x/3 = 6 \rightarrow x = 18$"},
    {q:"What is the length of the hypotenuse of a right triangle with sides 6 and 8?", a:"10", ops:["14","10","12","48"], ex:"$6^2 + 8^2 = 36 + 64 = 100 \rightarrow \sqrt{100} = 10$"},
    {q:"Find the 10th term of an AP: 5, 8, 11...", a:"32", ops:["30","32","35","29"], ex:"$a+(n-1)d \rightarrow 5+(9 \times 3) = 32$"},
    {q:"The midpoint of the line joining (2,4) and (6,8) is?", a:"(4,6)", ops:["(4,6)","(8,12)","(3,5)","(2,2)"], ex:"$(x1+x2)/2, (y1+y2)/2$"},
    {q:"Evaluate $4!$ (4 factorial).", a:"24", ops:["12","16","24","4"], ex:"$4 \times 3 \times 2 \times 1 = 24$"},
    {q:"If $y$ varies directly as $x$, and $y=10$ when $x=2$, find $y$ when $x=5$.", a:"25", ops:["20","25","15","50"], ex:"$k = y/x = 5 \rightarrow y = 5 \times 5 = 25$"},
    {q:"Find the inverse of the matrix [[1, 2], [3, 4]].", a:"[[-2, 1], [1.5, -0.5]]", ops:["[[4, -2], [-3, 1]]","[[-2, 1], [1.5, -0.5]]","[[1, 3], [2, 4]]","None"], ex:"$1/det \times$ adj matrix."},
    {q:"What is the mean of 10, 20, 30, 40?", a:"25", ops:["20","25","30","100"], ex:"$100 / 4 = 25$"},
    {q:"Solve for θ: $2 cos θ = 1$ (0 < θ < 90).", a:"60°", ops:["30°","45°","60°","90°"], ex:"$cos θ = 0.5 \rightarrow θ = 60°$"},
    {q:"Find the range of 15, 2, 8, 20, 4.", a:"18", ops:["18","20","15","5"], ex:"$Max - Min = 20 - 2 = 18$"}
];

// Filling the rest with unique variations to ensure 60 total
const extraMath = [
    {q:"Value of π in degrees?", a:"180°", ops:["90°","180°","360°","270°"], ex:"π radians = 180 degrees."},
    {q:"Surface area of a sphere with r=7?", a:"616", ops:["154","616","1078","308"], ex:"$4πr^2$"},
    {q:"Derivative of a constant?", a:"0", ops:["1","0","x","undefined"], ex:"Constants don't change."},
    {q:"Number of subsets in a set of 4 elements?", a:"16", ops:["4","8","16","32"], ex:"$2^n \rightarrow 2^4 = 16$"},
    {q:"Solve: $log_x 81 = 4$.", a:"3", ops:["3","9","2","4"], ex:"$x^4 = 81 \rightarrow x=3$"},
    {q:"Integration of $1/x$?", a:"ln x + C", ops:["x + C","ln x + C","-1/x^2","1"], ex:"Standard integral."},
    {q:"Area of triangle with base 10 and height 5?", a:"25", ops:["50","25","15","10"], ex:"$0.5 \times b \times h$"},
    {q:"Roots of $x^2 - 9 = 0$?", a:"3, -3", ops:["3, 0","9, -9","3, -3","3"], ex:"$(x-3)(x+3)$"},
    {q:"$Tan 45°$ is?", a:"1", ops:["0","1","0.5","Infinity"], ex:"Opposite/Adjacent is equal."},
    {q:"Distance between (0,0) and (3,4)?", a:"5", ops:["7","5","25","1"], ex:"Pythagoras distance formula."},
    {q:"Coefficient of $x$ in $3x^2 + 5x - 2$?", a:"5", ops:["3","5","-2","0"], ex:"The number before x."},
    {q:"Standard deviation is the square root of?", a:"Variance", ops:["Mean","Range","Variance","Mode"], ex:"Definition of SD."},
    {q:"How many sides has a decagon?", a:"10", ops:["8","10","12","20"], ex:"Deca means 10."},
    {q:"Sum of angles on a straight line?", a:"180°", ops:["90°","180°","360°","270°"], ex:"Straight angle property."},
    {q:"Prime numbers between 1 and 10?", a:"2, 3, 5, 7", ops:["1, 3, 5, 7","2, 3, 5, 7","2, 4, 6, 8","3, 5, 7, 9"], ex:"Factors are only 1 and itself."},
    {q:"If $3^{x} = 1/9$, find x.", a:"-2", ops:["2","-2","3","-3"], ex:"$3^{-2} = 1/3^2 = 1/9$"},
    {q:"A circle divided into two equal parts is a?", a:"Semicircle", ops:["Quadrant","Semicircle","Sector","Segment"], ex:"Half-circle."},
    {q:"Reciprocal of 0.25?", a:"4", ops:["2","4","0.5","0.75"], ex:"$1 / 0.25 = 4$"},
    {q:"Factors of $x^2 + x$?", a:"x(x+1)", ops:["x(x)","x(x+1)","(x+1)(x+1)","x^2"], ex:"Common factor x."},
    {q:"Sum of $0.1 + 0.01 + 0.001$?", a:"0.111", ops:["0.3","0.111","1.11","0.1"], ex:"Positional addition."},
    {q:"What is the perimeter of a square with area 16?", a:"16", ops:["4","8","16","32"], ex:"Side=4, Perimeter=4x4=16."},
    {q:"Complement of 30°?", a:"60°", ops:["60°","150°","90°","180°"], ex:"Sums to 90."},
    {q:"Supplement of 100°?", a:"80°", ops:["80°","260°","180°","10°"], ex:"Sums to 180."},
    {q:"Product of -5 and -4?", a:"20", ops:["-20","20","-9","9"], ex:"Negative x Negative = Positive."},
    {q:"Value of $5^0$?", a:"1", ops:["0","5","1","undefined"], ex:"Any non-zero number to power 0 is 1."},
    {q:"$25\%$ of 200?", a:"50", ops:["25","40","50","100"], ex:"$0.25 \times 200 = 50$"},
    {q:"Find x: $x - 10 = -5$.", a:"5", ops:["-15","15","5","-5"], ex:"$x = -5 + 10 = 5$"},
    {q:"A triangle with all sides equal is?", a:"Equilateral", ops:["Isosceles","Scalene","Equilateral","Right"], ex:"Equal-lateral."},
    {q:"$\sqrt{144}$?", a:"12", ops:["10","12","14","24"], ex:"$12 \times 12 = 144$"},
    {q:"Gradient of a horizontal line?", a:"0", ops:["1","0","Infinity","Undefined"], ex:"No rise, all run."}
];

const fullPool = [...masterDB, ...extraMath];
let quiz = []; let idx = 0; let stored = {}; let time = 1800; let ticker; let studentName = "";

function loadBest() {
    let b = localStorage.getItem('k_dev_math') || 0;
    document.getElementById('best-score').innerText = `Personal Best: ${b}/60`;
}

function initExam() {
    studentName = document.getElementById('user-name').value;
    if(!studentName) { alert("Designer says: Name required!"); return; }
    document.getElementById('start-page').classList.add('hidden');
    document.getElementById('exam-page').classList.remove('hidden');
    // Randomize and ensure no duplicates
    quiz = fullPool.sort(() => Math.random() - 0.5);
    drawNav(); render();
    ticker = setInterval(() => {
        time--; let m = Math.floor(time/60); let s = time%60;
        document.getElementById('timer').innerText = `${m}:${s<10?'0':''}${s}`;
        if(time <= 0) finalize();
    }, 1000);
}

function render() {
    let item = quiz[idx];
    document.getElementById('q-text').innerHTML = `<b>QUESTION ${idx+1}:</b><br>${item.q}`;
    let oh = '';
    item.ops.forEach(o => {
        oh += `<label class="opt-label ${stored[idx]===o?'selected':''}">
            <input type="radio" name="math" value="${o}" onchange="pick('${o}')" ${stored[idx]===o?'checked':''}> ${o}
        </label>`;
    });
    document.getElementById('options-area').innerHTML = oh;
    drawNav();
}

function pick(v) { stored[idx] = v; render(); }
function goTo(i) { idx = i; render(); }
function nav(d) { idx += d; if(idx < 0) idx = 0; if(idx > 59) idx = 59; render(); }
function drawNav() {
    let h = ''; quiz.forEach((_, i) => {
        h += `<div class="nav-dot ${i===idx?'active':''} ${stored[i]?'answered':''}" onclick="goTo(${i})">${i+1}</div>`;
    });
    document.getElementById('nav-grid').innerHTML = h;
}

function finalize() {
    clearInterval(ticker);
    let score = 0; let reviewH = '';
    quiz.forEach((itm, i) => {
        let u = stored[i] || "Skipped"; let win = u === itm.a; if(win) score++;
        reviewH += `<div class="glass" style="border-left: 6px solid ${win?'var(--success)':'var(--accent)'}">
            <p><b>Q${i+1}:</b> ${itm.q}</p>
            <p>Your Answer: ${u} | Correct: <b style="color:var(--success)">${itm.a}</b></p>
            <div class="explanation-card"><b>KELVIN'S LOGIC:</b> ${itm.ex}</div>
        </div>`;
    });
    
    document.getElementById('exam-page').classList.add('hidden');
    document.getElementById('result-page').classList.remove('hidden');
    document.getElementById('final-score').innerText = `${score} / 60`;
    document.getElementById('review-list').innerHTML = reviewH;

    fetch(WEB_APP_URL, {
        method: "POST",
        mode: "no-cors",
        body: JSON.stringify({
            name: studentName,
            score: score + "/60",
            subject: "Mathematics",
            date: new Date().toLocaleString()
        })
    }).then(() => {
        document.getElementById('sync-status').innerText = "Record synced to Google Sheets.";
    });
}
</script>
</body>
</html>
